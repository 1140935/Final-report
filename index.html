<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼？校園美食抽籤器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍔 今天吃什麼？</h1>

        <div class="filter-section">
    <select id="radius-select">
        <option value="500">📍 500 公尺 (走路 5 分鐘)</option>
        <option value="1000" selected>📍 1 公里 (走路 15 分鐘)</option>
        <option value="2000">📍 2 公里 (騎車距離)</option>
        <option value="5000">📍 5 公里 (開車距離)</option>
    </select>

    <select id="rating-filter">
        <option value="0">⭐ 所有評分</option>
        <option value="3.0">⭐⭐⭐ 3.0 以上</option>
        <option value="3.5">⭐⭐⭐✨ 3.5 以上</option>
        <option value="4.0">⭐⭐⭐⭐ 4.0 以上</option>
        <option value="4.5">⭐⭐⭐⭐✨ 4.5 以上</option>
        <option value="5.0">⭐⭐⭐⭐⭐ 5.0 (滿分)</option>
    </select>
</div>

        <div class="add-section">
            <input type="text" id="new-restaurant" placeholder="新增想吃的店...">
            <button id="add-btn" onclick="addRestaurant()">加入</button>
        </div>

        <div class="location-section" style="margin-bottom: 20px;">
            <button id="locate-btn" onclick="fetchNearbyRestaurants()" style="background-color: #fbbc05; width: 100%; color: #333;">
                📍 抓取所選範圍內的餐廳
            </button>
            <p id="location-status" style="font-size: 12px; color: #666; margin-top: 5px;"></p>
        </div>

        <div class="draw-section">
            <div id="result-box">點擊下方按鈕開始！</div>
            <a id="map-link" href="#" target="_blank" style="display: none;">📍 查看 Google Maps</a>
        </div>

        <button id="draw-btn" onclick="startDraw()">🎲 開始抽籤</button>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAaXEMCpH_vgP9G-mTQGftktt0JOR1kk4o&libraries&libraries=places"></script>
    <script src="script.js"></script>
</body>
</html>
